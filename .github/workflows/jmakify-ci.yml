---
# Builds and tests JMaskify with the Maven wrapper on JDK 17 (Temurin), then runs SonarCloud analysis
# when the SONAR_TOKEN secret is available (it is not on fork or Dependabot pull requests, so analysis is skipped there).
# On pushes to master, a separate job submits the Maven dependency graph to GitHub for Dependabot alerts.
#
# Every action is pinned to a full commit SHA; the trailing "# vX.Y.Z" comment is kept for Dependabot.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: JMaskify Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be referenced in `if:` expressions, so expose only whether the token is set ('true'/'false').
      # The token itself is passed to the SonarCloud step alone, keeping it away from the build and tests.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: SonarCloud analysis
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=ehayik_jmaskify

  # Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts
  dependency-graph:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Submit dependency graph
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
